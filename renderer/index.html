<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:;" />
  <title>Quota Halo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root">
    <div id="notch" class="pill-mode">
      <!-- collapsed pill: draggable (drag region), expand/collapse is driven
           by the main process cursor-watch so drag doesn't break hover -->
      <div id="mini" class="drag">
        <div class="mini-inner">
          <svg id="miniRing" class="ring mini" width="18" height="18" viewBox="0 0 20 20">
            <circle class="ring-track" cx="10" cy="10" r="8.5" />
            <circle class="ring-arc" id="miniArc" cx="10" cy="10" r="8.5" />
          </svg>
          <span id="miniText" class="mini-text">—</span>
          <span id="miniDots" class="mini-dots"></span>
          <span id="miniWarn" class="mini-warn hidden"></span>
        </div>
      </div>

      <!-- expanded card -->
      <div id="full">
        <div class="full-header drag">
          <div class="full-title">
            <span class="title-name" id="titleName">用量與額度</span>
            <span class="title-sub" id="titleSub">—</span>
          </div>
          <div class="full-actions">
            <button id="btnRefresh" class="icon-btn" title="重整" aria-label="重整目前讀數">
              <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20 4v4h-4"/></svg>
            </button>
            <button id="btnPin" class="icon-btn" title="釘住／隨滑鼠展開" aria-label="釘住或取消釘住">
              <svg viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 3h6l1 7 2 2H6l2-2z"/></svg>
            </button>
            <button id="btnSettings" class="icon-btn" title="設定" aria-label="開啟設定">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
            </button>
          </div>
        </div>

        <div class="cells" id="cells"></div>

        <div class="detail-panel">
          <div class="dp-head">
            <img class="dp-logo hidden" alt="" />
            <span class="dp-glyph" id="dpGlyph"></span>
            <span class="dp-name" id="dpName"></span>
            <span class="dp-plan" id="dpPlan"></span>
            <span class="dp-fid" id="dpFid"></span>
            <span class="spacer"></span>
            <span class="dp-upd" id="dpUpd"></span>
          </div>
          <div id="dpBanner" class="dp-banner hidden"></div>
          <div class="dp-rows" id="dpRows"></div>
          <div class="dp-activity" id="activityLine">
            <span id="actDot" class="dot"></span>
            <span id="activityText"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
